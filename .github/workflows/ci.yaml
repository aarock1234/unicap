name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Tidy
        run: go mod tidy -diff

      - name: Lint
        run: make lint

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: README is up to date
        run: make readme && git diff --exit-code README.md

      - name: Test
        run: make test
